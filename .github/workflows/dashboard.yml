# Daily download snapshot of every cask's release assets → Tap Insights page (GitHub Pages).
# History lives on the `stats` branch, so main never gets bot commits.
name: Dashboard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Casks/**", "dashboard/**", ".github/workflows/dashboard.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the stats branch
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git fetch --depth 1 origin stats
            git worktree add stats origin/stats
          else
            git worktree add --orphan -b stats stats
          fi

      - name: Collect download counts
        run: python3 dashboard/collect.py stats/downloads.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save history
        working-directory: stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.json
          git diff --cached --quiet || git commit -q -m "stats $(date -u +%F)"
          git push -q origin HEAD:stats

      - name: Assemble site
        run: |
          mkdir _site
          cp dashboard/index.html stats/downloads.json _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
